<!--All Tags in HTML-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tags to be used in HTML</title>
</head>
<body>
    <!--Anchor Tag used to refer link in webpage denoted by <a>-->
    <a href="https://www.google.com/">Google</a> 
    <a href="https://www.instagram.com/">Instagram</a>
    <br> <!--Break a line to next line-->
    <!--Image Tag used to add image in web page <img> -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTV7u-Xbapnod8A5726p_Kf5JQt9qyr_aspsw&s" alt="Iron Man Avengers" heigh="200px" width="200px">
    <p>Twinkle <b>Twinkle Little Star How I wonder</b> what you are 1</p> <!--Bold-->
    <p>Twinkle <i>Twinkle Little Star How I wonder</i> what you are 2</p>  <!--Italic-->
    <p>Twinkle <u>Twinkle Little Star How</u> I wonder what you are 3</p>  <!--Underline-->
</body>
</html>
