<!--Unordered List & Ordered List in HTML-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>
<body>
    <h2>Unordered List</h2>
    <ul>
        <li>Burger</li>
        <li>Pizza</li>
        <li>Momos</li>
    </ul>
    <br>
    <h2>Ordered List - 1</h2>
    <ol>
        <li>Burger</li>
        <li>Pizza</li>
        <li>Noodles</li>
    </ol>
    <h2>Ordered List - 2 (using type attribute)</h2>
    <ol type="A">
        <li>Burger</li>
        <li>Pizza</li>
        <li>Noodles</li>
    </ol>
</body>
</html>
