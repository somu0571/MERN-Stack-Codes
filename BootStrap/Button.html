<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Styling in BootStrap CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="Button.css">
</head>
<body>
    <button class="btn btn-dark">Buri nazar walay tera mu kala</button> <!--btn-dark etc.. changes the color of button-->

    <button class="btn btn-outline-warning btn-lg">Hello World</button>
</body>
</html>
