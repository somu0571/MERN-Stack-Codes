<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button GRp in BootStrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <h2>Button Grp in BootStrap</h2>
    <div class="btn-group"> <!--btn-group use to join buttons in one grp-->
        <button class="btn btn-success">one</button>
        <button class="btn btn-danger">two</button>
        <button class="btn btn-success">three</button>
    </div>
</body>
</html>
