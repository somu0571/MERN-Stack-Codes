<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in BootStrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mb-3">
        <h2>Form Demo</h2>
        <form class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="text" class="form-control" placeholder="Email" id="email">
            <label class="form-label" for="pass">Password</label>
            <input type="password" class="form-control" placeholder="Password" id="pass">
            <!--Select Class using BootStrap-->
            <br>
            <div class="mb-3">
                <select class="form-select">
                    <option selected>Select Your Lucky Number</option>
                    <option value="1">one</option>
                    <option value="2">two</option>
                    <option value="3">three</option>
                </select>
            </div>
            <br>
            <!--Check box-->
            <div class="mb-3">
                <input type="checkbox" class="form-check-input" id="a">
                <label for="a">Agree</label>
            </div>
            <div class="mb-3 form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="s">
                <label for="s">On/Off</label>
            </div>
        </form>
    </div>
</body>
</html>
