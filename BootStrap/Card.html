<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card in Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="card" style="width: 18rem;">
        <img src="images.jpeg" class="card-img-top" />
        <div class="card-body">
            <h5 class="card-heading">Lionel Andres Messi</h5>
            <p class="card-text">Argentine, Jersey no.10, FC Barcelona, Inter City Miami, Paris-Saint-German</p>
            <a href="#" class="btn btn-primary">Click Here for More</a>
        </div>
    </div>
</body>
</html>
