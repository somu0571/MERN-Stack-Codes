<!--Hr tag basically works as a divider -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hr Tag</title>
</head>
<body>
    <p>My name is Tony Stark</p>
    <p>My name is Fernandes</p>
    <hr>
    <p>My name is Ronaldo</p>
    <p>My name is Messi</p>
</body>
</html>
