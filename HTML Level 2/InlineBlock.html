<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline vs Block</title>
</head>
<body>
    <h1>Hello World</h1> <!--Heading tags are block elements-->
    <h2>Hello Som</h2>
    <p>Hello Jake</p> <!--Paragraph tags are block elements-->
    <p>Hello Max</p> 
    <a></a> <!--Anchor tag is a Inline element-->
    <img> <!--Image tag is a Inline element-->
</body>
</html>
