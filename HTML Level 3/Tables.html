<!--Tables in HTML-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>
<body>
    <table border="blue">
        <caption>Food Menu</caption>
        <thead> <!--Used thead as Semantic in HTML-->
        <tr>
            <th>Food</th>
            <th>Price</th>
        </tr>
        </thead>
        <tbody>  <!--tbody semantic tag-->
        <tr>
            <td>Samosa</td>
            <td>$ 10</td>
        </tr>
        <tr>
            <td>Pizza</td>
            <td>$ 400</td>
        </tr>
        <tr>
            <td>Burger</td>
            <td>$ 600</td>
        </tr>
        </tbody>
        <tfooter>  <!--tfooter semantic tag-->
            <td>Total</td>
            <td>$ 1010</td>
        </tfooter>
    </table>
</body>
</html>
