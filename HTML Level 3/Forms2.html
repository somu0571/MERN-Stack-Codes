<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms 2</title>
</head>
<body>
    <form action="/server">
        <div>
            <label>
                Username
                <input type="text" placeholder="Enter your username" name="username"> <!--file:///server?username=hddd this appeared due to name attribute-->
            </label>
        </div>
        <div>
            <label>
                Password
                <input type="password" placeholder="Enter your password">
            </label>
        </div>
        <button>Submit</button>
    </form>
    <hr>
    <!--Search fetching using action & name-->
    <form action="https://www.youtube.com/results">
        <input type="text" placeholder="search on youtube" name="search_query">
        <button>Search</button>
    </form>
    <!--Using checkbox in forms in HTML-->
    <form action="/service">
        <label for="C">Verify Bot</label>
        <input id="C" type="checkbox" name="age">
    </form>
    <!--Radio uses in html-->
    <form>
        <div>
            <label for="apple">Apple</label>
            <input type="radio" id="apple" name="api">
            <br>
            <label for="mango">Mango</label>
            <input type="radio" id="mango" name="api">
            <br>
            <label for="orange">Orange</label>
            <input type="radio" id="orange" name="api">
            <br>
            <label for="strawberry">strawberry</label>
            <input type="radio" id="strawberry" name="api">
        </div>
        <hr>
        <!--Use of DropDown List-->
        <div>
            Select Your Profession : 
            <select name="profession" id="profession">
                <option value="stu">Student</option>
                <option value="dev"> Developer</option>
            </select>
        </div>
        <div>
            <label for="v">Volumne Controller</label>
            <input type="range" id="v" min="0" max="100" name="volume">
        </div>
        <div>
            <label for="t">Feedback</label>
            <textarea id="t" name="feedback" placeholder="pls type here"></textarea>
        </div>
    </form>
</body>
</html>
