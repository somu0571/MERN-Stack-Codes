<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>
<body>
    <form action="/service">
        <h1>Registration Form</h1>
        <div>
        <input id="F" type="text" placeholder="First Name">
        <input id="M" type="text" placeholder="Last Name">
        </div>
        <div>
        Choose your Gender
        <select id="G" name="g">
            <option id="m" name="m">Male</option>
            <option id="f" name="f">Female</option>
            <option id="t" name="t">Transgender</option>
        </select>
        </div>
        Do you agree all terms & condition ?
        <input id="y" name="y" type="checkbox">
        <b>Yes</b>, I agree all the terms & condition
        <div>
        <button id="btn">Register</button>
        </div>
    </form>
</body>
</html>
