<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment - 3</title>
</head>
<body>
    <table border="black">
        <caption>Student Information</caption>
        <tr>
            <th rowspan="6">Info</th>
            <th rowspan="2">Name</th>
            <th colspan="2">Address</th>
        </tr>
        <tr>
            <th>City</th>
            <th>House</th>
        </tr>
        <tr>
            <td>A</td>
            <td>Delhi</td>
            <td>1</td>
        </tr>
        <tr>
            <td>B</td>
            <td>Mumbai</td>
            <td>2</td>
        </tr>
        <tr>
            <td>C</td>
            <td>Kolkata</td>
            <td>3</td>
        </tr>
        <tr>
            <td>D</td>
            <td>Pune</td>
            <td>4</td>
        </tr>
    </table>
    <hr>
    <!--Q2-->
    <form>
        <div>
        <label for="name">Name:</label>
        <input type="text" id="name">
        </div>
        <span>
            Sex:
            <label for="gen">Male</label>
            <input type="radio" id="gen">
            <label for="gen">Female</label>
            <input type="radio" id="gen">
        </span>
        <br>
        <br>
        <label for="count">Country</label>
        <select id="count">
            <option id="IND">India</option>
            <option id="US">USA</option>
            <option id="NEP">Nepal</option>
            <option id="CAN">Cananda</option>
            <option id="sel" selected>Select Country</option>
        </select>
        <br>
        <br>
        <div>
            <label for="U">Message</label>
            <br>
            <textarea id="U" row="50" col="10"></textarea>
        </div>
        <input type="checkbox" id="check">
        <label for="check">Subscribe ? </label>
        <br>
        <button>Submit</button>
    </form>
    <hr>
    <!--Q3-->
    <form>
        <h1>Feedback Form</h1>
        <div>
            <label for="name">Name : </label>
            <input id="name" type="text" placeholder="Write your name">
        </div>
        <div>
            <label for="email">Email : </label>
            <input id="email type=text" placeholder="Write your email">
        </div>
        <div>
            <label for="msg">Message</label>
            <br>
            <textarea id="msg" placeholder="Enter your Message"></textarea>
        </div>
        <div>
            Rate us out of 5
            <br>
            <label for="1">1 </label>
            <input id="1" type="radio">
            <br>
            <label for="2">2 </label>
            <input id="2" type="radio">
            <br>
            <label for="3">3 </label>
            <input id="3" type="radio">
            <br>
            <label for="4">4 </label>
            <input id="4" type="radio">
            <br>
            <label for="5">5 </label>
            <input id="5" type="radio">
        </div>
        <button>Send your Message</button>
    </form>
</body>
</html>
