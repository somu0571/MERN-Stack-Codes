<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Include CSS in HTML using Style Tag</title>
</head>
<body>
    <style>
        h1 {
            color: aqua;
        }
        body {
            background-color: blue;
        }
    </style>
    <h1> Bonjour </h1>
</body>
</html>
